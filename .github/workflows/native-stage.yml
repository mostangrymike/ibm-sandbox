name: Native staging host checks

on:
  push:
    paths:
      - 'src/GITCWALK.C'
      - 'src/GITCIDX.C'
      - 'src/CMSCLNK.EXEC'
      - 'docs/BUILD.md'
      - 'tests/check-cmsclnk-source.sh'
      - 'tests/native_stage_host.c'
      - 'tests/native_index_host.c'
      - 'tests/run-native-stage-host.sh'
      - '.github/workflows/native-stage.yml'
  pull_request:
    paths:
      - 'src/GITCWALK.C'
      - 'src/GITCIDX.C'
      - 'src/CMSCLNK.EXEC'
      - 'docs/BUILD.md'
      - 'tests/check-cmsclnk-source.sh'
      - 'tests/native_stage_host.c'
      - 'tests/native_index_host.c'
      - 'tests/run-native-stage-host.sh'
      - '.github/workflows/native-stage.yml'

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check neutral compiler EXEC source and F-disk setup
        run: sh tests/check-cmsclnk-source.sh
      - name: Compile and test CMS staging and OID index on host
        run: sh tests/run-native-stage-host.sh
