name: Native staging host checks

on:
  push:
    paths:
      - 'src/GITCWALK.C'
      - 'tests/native_ref_pack_host.c'
      - 'tests/make-native-ref-pack.py'
      - 'src/GITCIDX.C'
      - 'tests/check-canonical-source.sh'
      - 'src/CMSCLNK.EXEC'
      - 'docs/BUILD.md'
      - 'tests/check-cmsclnk-source.sh'
      - 'tests/native_stage_host.c'
      - 'tests/native_index_host.c'
      - 'tests/test-native-cathex-large.py'
      - 'tests/test-native-tree.py'
      - 'tests/fixtures/first-commit-README.md'
      - 'src/GITRCHK.EXEC'
      - 'src/GITRUN.EXEC'
      - 'src/GITVREF.EXEC'
      - 'src/GITREF2.REPO'
      - 'src/GIT.EXEC'
      - 'tests/check-verified-ref.sh'
      - 'src/M155CHK.EXEC'
      - 'tests/check-m155-compact.sh'
      - 'src/M156CHK.EXEC'
      - 'tests/test-m156-presence-duration.py'
      - 'src/M157CHK.EXEC'
      - 'tests/test-m157-presence-age.py'
      - 'src/M158CHK.EXEC'
      - 'tests/test-m158-presence-time.py'
      - 'src/M159CHK.EXEC'
      - 'tests/test-m159-presence-ratio.py'
      - 'src/M160CHK.EXEC'
      - 'tests/test-m160-presence-coverage.py'
      - 'src/M157GATE.EXEC'
      - 'tests/check-m157-gate.sh'
      - 'tests/check-readonly-gitrchk.sh'
      - 'scripts/backup-offline-dasd.sh'
      - 'scripts/inspect-hercules-config.sh'
      - 'scripts/map-cms-minidisk.sh'
      - 'tests/test-map-cms-minidisk.sh'
      - 'tests/test-hercules-config.sh'
      - 'tests/test-offline-dasd-backup.sh'
      - 'src/GITSEL.C'
      - 'src/GITREC.C'
      - 'tests/test_native_selector.py'
      - 'tests/native_selector_verify_host.c'
      - 'tests/run-native-stage-host.sh'
      - '.github/workflows/native-stage.yml'
  pull_request:
    paths:
      - 'src/GITCWALK.C'
      - 'tests/native_ref_pack_host.c'
      - 'tests/make-native-ref-pack.py'
      - 'src/GITCIDX.C'
      - 'tests/check-canonical-source.sh'
      - 'src/CMSCLNK.EXEC'
      - 'docs/BUILD.md'
      - 'tests/check-cmsclnk-source.sh'
      - 'tests/native_stage_host.c'
      - 'tests/native_index_host.c'
      - 'tests/test-native-cathex-large.py'
      - 'tests/test-native-tree.py'
      - 'tests/fixtures/first-commit-README.md'
      - 'src/GITRCHK.EXEC'
      - 'src/GITRUN.EXEC'
      - 'src/GITVREF.EXEC'
      - 'src/GITREF2.REPO'
      - 'src/GIT.EXEC'
      - 'tests/check-verified-ref.sh'
      - 'src/M155CHK.EXEC'
      - 'tests/check-m155-compact.sh'
      - 'src/M156CHK.EXEC'
      - 'tests/test-m156-presence-duration.py'
      - 'src/M157CHK.EXEC'
      - 'tests/test-m157-presence-age.py'
      - 'src/M158CHK.EXEC'
      - 'tests/test-m158-presence-time.py'
      - 'src/M159CHK.EXEC'
      - 'tests/test-m159-presence-ratio.py'
      - 'src/M160CHK.EXEC'
      - 'tests/test-m160-presence-coverage.py'
      - 'src/M157GATE.EXEC'
      - 'tests/check-m157-gate.sh'
      - 'tests/check-readonly-gitrchk.sh'
      - 'scripts/backup-offline-dasd.sh'
      - 'scripts/inspect-hercules-config.sh'
      - 'scripts/map-cms-minidisk.sh'
      - 'tests/test-map-cms-minidisk.sh'
      - 'tests/test-hercules-config.sh'
      - 'tests/test-offline-dasd-backup.sh'
      - 'src/GITSEL.C'
      - 'src/GITREC.C'
      - 'tests/test_native_selector.py'
      - 'tests/native_selector_verify_host.c'
      - 'tests/run-native-stage-host.sh'
      - '.github/workflows/native-stage.yml'

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test CP-to-Hercules read-only minidisk correlation
        run: bash tests/test-map-cms-minidisk.sh
      - name: Test read-only Hercules config inventory
        run: sh tests/test-hercules-config.sh
      - name: Test offline-only DASD backup safeguards
        run: sh tests/test-offline-dasd-backup.sh
      - name: Enforce read-only CMS CATHEX gate and cleanup hold
        run: sh tests/check-readonly-gitrchk.sh
      - name: Check verified modern REF2 read-only bridge
        run: sh tests/check-verified-ref.sh
      - name: Check compact CMS target gate source
        run: sh tests/check-m155-compact.sh
      - name: Check M156 authenticated presence duration
        run: python3 tests/test-m156-presence-duration.py
      - name: Check M157 authenticated current presence age
        run: python3 tests/test-m157-presence-age.py
      - name: Check M158 authenticated presence time
        run: python3 tests/test-m158-presence-time.py
      - name: Check M159 authenticated presence ratio
        run: python3 tests/test-m159-presence-ratio.py
      - name: Check M160 authenticated presence coverage
        run: python3 tests/test-m160-presence-coverage.py
      - name: Check combined compact M157 target gate
        run: sh tests/check-m157-gate.sh
      - name: Check neutral compiler EXEC source and F-disk setup
        run: sh tests/check-cmsclnk-source.sh
      - name: Reject native-text Git object headers in CMS C source
        run: sh tests/check-canonical-source.sh
      - name: Compile and fuzz interrupted writes in native C89 selector
        run: python3 tests/test_native_selector.py
      - name: Check full 64-KiB binary CATHEX output and verified fallback
        run: python3 tests/test-native-cathex-large.py
      - name: Verify complete binary Git tree parsing and recovery
        run: python3 tests/test-native-tree.py
      - name: Compile and test staging, OID index and native REF PACK on host
        run: sh tests/run-native-stage-host.sh
