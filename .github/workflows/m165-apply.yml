name: Publish clean M165 branch

on:
  push:
    branches:
      - m165-staged-commit
    paths:
      - 'scripts/m165/gitwt_helpers.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m165-staged-commit
          fetch-depth: 0
      - name: Publish clean production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -b m165-clean origin/main
          git cherry-pick e31ba10aa5cc6d187e877dbbb578ff0c613c0bb2
          git cherry-pick bf4aa9fe5dae03b93c9866a611d06dd213ca04c8
          git push origin m165-clean
