name: Publish M165 source to main

on:
  push:
    branches:
      - m165-staged-commit
    paths:
      - 'README.md'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m165-staged-commit
          fetch-depth: 0
      - name: Publish tested M165 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-main origin/main
          git checkout 930c1e88728b80fd27777c05858ec797164d90e3 -- docs/M165.md
          git checkout 930c1e88728b80fd27777c05858ec797164d90e3 -- src/GIT.EXEC
          git checkout 930c1e88728b80fd27777c05858ec797164d90e3 -- src/GITVREF.EXEC
          git checkout 930c1e88728b80fd27777c05858ec797164d90e3 -- src/GITWT.EXEC
          git checkout 930c1e88728b80fd27777c05858ec797164d90e3 -- src/M165CHK.EXEC
          git checkout 930c1e88728b80fd27777c05858ec797164d90e3 -- tests/check-verified-ref.sh
          git checkout 930c1e88728b80fd27777c05858ec797164d90e3 -- tests/test-m165-staged-commit.py
          git add docs/M165.md src/GIT.EXEC src/GITVREF.EXEC src/GITWT.EXEC
          git add src/M165CHK.EXEC tests/check-verified-ref.sh
          git add tests/test-m165-staged-commit.py
          git commit -m "M165: staged commit object"
          git push origin HEAD:main
