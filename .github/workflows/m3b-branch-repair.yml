name: Prepare M3B validation branch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[skip-m3b-prepare]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact M3B branch delta
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          branch='m3b-stack-return'
          subprocess.run(['git','fetch','origin',branch],check=True)
          subprocess.run(['git','checkout','-B',branch,'origin/'+branch],check=True)
          # Restore the proven 0.8 assembler byte-for-byte, then apply only M3B.
          subprocess.run(['git','checkout','144ceed56d69833aa52de6487a47d6ed33279c77','--','src/GITCORE.ASSEMBLE'],check=True)
          p=Path('src/GITCORE.ASSEMBLE')
          s=p.read_text()
          def once(old,new):
              global s
              if s.count(old)!=1:
                  raise SystemExit('anchor count '+str(s.count(old))+' for '+repr(old[:40]))
              s=s.replace(old,new,1)
          once("         CLC   0(7,2),=C'BLOBHEX'\n         BE    BLOBHEX\n",
               "         CLC   0(7,2),=C'BLOBHEX'\n         BE    BLOBHEX\n         CLC   0(7,2),=C'BLOBSTK'\n         BE    BLOBSTK\n")
          once("BLOBHEX  ST    14,CALLRET\n",
               "BLOBSTK  LA    10,1\n         B     BHENTRY\nBLOBHEX  SR    10,10\nBHENTRY  ST    14,CALLRET\n")
          once("         BCT   4,BHOUT\n         LINEWRT DATA=(HEXDIG,40)\n         B     SHA1OK\n",
               "         BCT   4,BHOUT\n         LTR   10,10\n         BZ    BHPRINT\n         CMSSTACK TEXT=(HEXDIG,40)\n         B     SHA1OK\nBHPRINT  LINEWRT DATA=(HEXDIG,40)\n         B     SHA1OK\n")
          once("VERSION  DC    C'GITCORE 0.8 CMS/ZVM'", "VERSION  DC    C'GITCORE 0.9 CMS/ZVM'")
          once("USAGE    DC    C'Usage: VERSION BLOBABC BLOBHEX SHA1ABC'\n-PLACEHOLDER", "never") if False else None
          old="USAGE    DC    C'Usage: VERSION BLOBABC BLOBHEX SHA1ABC'\n         DC    C' SHA1EMP SHA1TWO SHA1MUL SHA1HEX'"
          new="USAGE    DC    C'Usage: VERSION BLOBABC BLOBHEX BLOBSTK'\n         DC    C' SHA1ABC SHA1EMP SHA1TWO SHA1MUL SHA1HEX'"
          once(old,new)
          p.write_text(s)
          # GIT.EXEC on this branch already contains the stack caller; leave it intact.
          subprocess.run(['git','diff','--check'],check=True)
      - name: Commit and push validation branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/GITCORE.ASSEMBLE src/GIT.EXEC
          git commit -m "M3B: clean CMS stack-return interface"
          git push --force-with-lease origin HEAD:m3b-stack-return
